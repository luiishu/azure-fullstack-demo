<section class="page-container">
    <mat-card class="welcome-card">
        <mat-card-header>
            <div class="welcome-heading">
                <mat-icon>yard</mat-icon>
                <mat-card-title>Welcome to Azure Fullstack Demo</mat-card-title>
            </div>
        </mat-card-header>

        <mat-card-content>
            <p>Please sign in with your account to access the dashboard.</p>
        </mat-card-content>

        <mat-card-actions>
            <button mat-raised-button class="login-button" (click)="login()">
                Sign in with Microsoft
            </button>
        </mat-card-actions>
    </mat-card>
</section>
